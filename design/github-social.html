<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arcane Transit Authority: GitHub preview</title>
<style>
  @font-face { font-family: 'ATA Display'; src: url(../game/fonts/ATADisplay.woff2) format('woff2'); font-weight: 400 900; font-display: block; }
  @font-face { font-family: 'Exo 2'; src: url(../game/fonts/Exo2.woff2) format('woff2'); font-weight: 100 900; font-display: block; }
  html, body { margin: 0; padding: 0; background: #070a1c; }
  .card { position: relative; width: 1280px; height: 640px; overflow: hidden; background: #070a1c; }
  /* the key art, shifted right so the planet's cut-away core sits right of the title */
  .art { position: absolute; top: -36px; left: 110px; width: 1250px; height: auto; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 160px); mask-image: linear-gradient(90deg, transparent 0, #000 160px); }
  .shade { position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(7,10,28,0.95) 0%, rgba(7,10,28,0.88) 28%, rgba(7,10,28,0.45) 46%, rgba(7,10,28,0) 62%),
      linear-gradient(0deg, rgba(7,10,28,0.55) 0%, rgba(7,10,28,0) 22%),
      radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 62%, rgba(7,10,28,0.55) 100%); }
  .text { position: absolute; left: 168px; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; }
  .ata { font-family: 'ATA Display', sans-serif; font-weight: 900; font-size: 160px; line-height: 0.9; letter-spacing: 0.08em; margin-left: -6px;
    background: linear-gradient(180deg, #ffffff 0%, #dfe5f2 45%, #8f9ab5 55%, #e9eef8 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 22px rgba(255, 217, 160, 0.40)) drop-shadow(0 5px 0 rgba(0,0,0,0.6)); }
  .name { font-family: 'ATA Display', sans-serif; font-weight: 600; font-size: 25px; letter-spacing: 0.22em; text-transform: uppercase; white-space: nowrap;
    color: #ffd9a0; margin-top: 14px; text-shadow: 0 0 14px rgba(255,217,160,0.5), 0 2px 4px rgba(0,0,0,0.8); }
  .rails { display: flex; gap: 8px; margin: 22px 0 20px; }
  .rails i { display: block; width: 58px; height: 5px; border-radius: 3px; box-shadow: 0 0 10px currentColor; background: currentColor; }
  .tag { font-family: 'Exo 2', sans-serif; font-weight: 500; font-size: 25px; line-height: 1.3; color: #e8ecf6; max-width: 430px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.9); }
</style>
</head>
<body>
<div class="card">
  <img class="art" src="../game/assets/keyart/globe.jpg" alt="">
  <div class="shade"></div>
  <div class="text">
    <div class="ata">ATA</div>
    <div class="name">Arcane Transit Authority</div>
    <div class="rails"><i style="color:#2fd67b"></i><i style="color:#2f6bff"></i><i style="color:#ff5a1f"></i><i style="color:#4fe3ff"></i></div>
    <div class="tag">Run your rails through earth, water, fire and air</div>
  </div>
</div>
</body>
</html>
